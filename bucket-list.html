<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Bucket List</title><link rel="stylesheet" href="style2.css"><style>.page{width:min(820px,100%);margin:auto;padding:28px clamp(20px,5vw,64px) 54px}.back{display:inline-block;margin-top:42px;color:var(--accent);text-decoration:none;font-weight:700}.heading{margin:52px 0 28px}.heading h1{margin:9px 0;font:600 clamp(2.7rem,8vw,4.8rem)/.95 "Playfair Display",serif;letter-spacing:-.06em}.heading em{color:var(--accent)}.heading p{margin:0;color:var(--muted)}.composer{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}.composer input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;outline:0;padding:8px}.send{border:0;border-radius:999px;padding:10px 15px;background:var(--accent);color:#fff;font:700 .9rem "DM Sans",sans-serif;cursor:pointer}.list{display:grid;gap:11px;margin-top:24px}.item{display:flex;align-items:center;gap:14px;padding:15px 17px;border:1px solid var(--line);border-radius:17px;background:var(--surface);box-shadow:var(--shadow)}.item input{appearance:none;width:22px;height:22px;flex:0 0 22px;margin:0;border:1px solid var(--accent);border-radius:50%;background:transparent;cursor:pointer}.item input:checked{background:var(--accent);box-shadow:inset 0 0 0 5px var(--surface-strong)}.item span{overflow-wrap:anywhere}.item.done span{text-decoration:line-through;color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.status{min-height:20px;margin:10px 2px;color:var(--muted);font-size:.85rem}@media(max-width:500px){.back{margin-top:30px}.heading{margin-top:40px}.composer{align-items:stretch;flex-direction:column}}</style></head><body><main class="page"><header class="topbar"><a class="brand" href="EgZjaHJvbWUqBwgDEA.html">orange <span>♥</span></a><div class="topb
