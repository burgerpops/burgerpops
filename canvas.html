<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Doodles</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style2.css"><style>.page{width:min(900px,100%);margin:auto;padding:28px clamp(20px,5vw,64px)}.back{display:inline-block;margin-top:45px;color:var(--accent);text-decoration:none;font-weight:700}.heading{margin:38px 0 24px}.heading h1{margin:8px 0;font:600 clamp(2.7rem,7vw,5rem)/.95 "Playfair Display",serif;letter-spacing:-.06em}.heading p{color:var(--muted);margin:0}.board{padding:14px;border:1px solid var(--line);border-radius:26px;background:var(--surface-strong);box-shadow:var(--shadow)}canvas{display:block;width:100%;aspect-ratio:16/10;border-radius:17px;background:#fffafa;touch-action:none;cursor:crosshair}.tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:14px}.tools label{color:var(--muted);font-size:.86rem}.tools input[type=color]{width:34px;height:34px;padding:2px;border:1px solid var(--line);border-radius:50%;background:transparent}.tools input[type=range]{accent-color:var(--accent)}.tools button{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);font:600 .87rem "DM Sans",sans-serif;cursor:pointer}.tools .save{background:var(--accent);color:#fff;border-color:var(--accent)}.note{margin:14px 2px 0;color:var(--muted);font-size:.82rem}@media(max-width:500px){.tools{gap:8px}.tools button{padding:8px 11px}}</style></head><body><main class="page"><header class="topbar"><a class="brand" href="EgZjaHJvbWUqBwgDEA.html">orange <span>♥</span></a><div class="topbar-actions"><button class="theme-toggle" id="theme-toggle" type="button"><span aria-hidden="true">☾</span> Theme</button><button id="logout-btn" type="button"><span aria-hidden="true">↪</span> Log out</button></div></header><a class="back" href="EgZjaHJvbWUqBwgDEA.html">← Back home</a><section class="heading"><p class="eyebrow">a small mark of love</p><h1>Little doodles.</h1><p>Draw something sweet. It stays on this device until you clear it.</p></section><section class="board"><canvas id="canvas" aria-label="Drawing canvas"></canvas><div class="tools"><label>Colour <input id="colour" type="color" value="#be657b"></label><label>Size <input id="size" type="range" min="1" max="24" value="5"></label><button id="undo" type="button">Undo</button><button id="clear" type="button">Clear</button><button class="save" id="save" type="button">Save doodle</button></div><p class="note" id="notice" role="status">Your saved doodle will reappear on this device.</p></section></main><script src="theme.js"></script><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),colour=document.getElementById('colour'),size=document.getElementById('size'),key='our-little-doodle';let drawing=false,history=[];function setup(){const saved=localStorage.getItem(key);canvas.width=1200;canvas.height=750;ctx.fillStyle='#fffafa';ctx.fillRect(0,0,canvas.width,canvas.height);if(saved){const image=new Image();image.onload=()=>ctx.drawImage(image,0,0);image.src=saved}}function point(event){const rect=canvas.getBoundingClientRect(),touch=event.touches?.[0]||event;return{x:(touch.clientX-rect.left)*canvas.width/rect.width,y:(touch.clientY-rect.top)*canvas.height/rect.height}}function start(event){drawing=true;history.push(canvas.toDataURL());const p=point(event);ctx.beginPath();ctx.moveTo(p.x,p.y)}function draw(event){if(!drawing)return;event.preventDefault();const p=point(event);ctx.lineTo(p.x,p.y);ctx.strokeStyle=colour.value;ctx.lineWidth=size.value;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',draw);['pointerup','pointerleave','pointercancel'].forEach(type=>canvas.addEventListener(type,()=>drawing=false));document.getElementById('undo').addEventListener('click',()=>{const previous=history.pop();if(!previous)return;const image=new Image();image.onload=()=>ctx.drawImage(image,0,0);image.src=previous});document.getElementById('clear').addEventListener('click',()=>{history.push(canvas.toDataURL());ctx.fillStyle='#fffafa';ctx.fillRect(0,0,canvas.width,canvas.height)});document.getElementById('save').addEventListener('click',()=>{try{localStorage.setItem(key,canvas.toDataURL('image/png'));document.getElementById('notice').textContent='Saved on this device with love.'}catch{document.getElementById('notice').textContent='This doodle is too large to save here.'}});document.getElementById('logout-btn').addEventListener('click',()=>{localStorage.removeItem('accessGranted');location.href='index.html'});setup()</script></body></html>
