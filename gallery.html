<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Gallery</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style2.css"><style>.gallery-page{width:min(1140px,100%);margin:auto;padding:28px clamp(20px,5vw,64px) 58px}.back{display:inline-block;margin-top:44px;color:var(--accent);text-decoration:none;font-weight:700}.intro{padding:42px 0 25px;text-align:center}.intro h1{margin:9px 0;font:600 clamp(3rem,8vw,5.6rem)/.9 "Playfair Display",serif;letter-spacing:-.07em}.intro h1 em{color:var(--accent)}.intro p:last-child{max-width:460px;margin:0 auto;color:var(--muted);line-height:1.6}.coverflow{position:relative;height:clamp(330px,52vw,510px);margin:8px -4vw 18px;overflow:hidden;perspective:1400px}.slide{position:absolute;left:50%;top:50%;width:clamp(190px,34vw,365px);aspect-ratio:4/5;margin:0;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--surface-strong);box-shadow:0 18px 42px rgba(55,26,36,.21);transform-style:preserve-3d;transition:transform .48s cubic-bezier(.2,.8,.2,1),opacity .48s ease,filter .48s ease;cursor:pointer}.slide img{width:100%;height:100%;display:block;object-fit:cover}.slide.is-hidden{opacity:0;pointer-events:none}.controls{display:flex;justify-content:center;gap:10px}.controls button{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--text);font-size:1.2rem;cursor:pointer;transition:transform .2s}.controls button:hover{transform:translateY(-2px)}.counter{min-width:75px;display:grid;place-items:center;color:var(--muted);font-size:.84rem}.upload{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:30px auto 0;max-width:690px;padding:17px 20px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}.upload p{margin:0;color:var(--muted);font-size:.86rem}.upload label{padding:10px 15px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.upload input{display:none}.status{min-height:22px;max-width:690px;margin:12px auto;color:var(--muted);font-size:.86rem;text-align:center}.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}@media(max-width:700px){.gallery-page{padding-bottom:38px}.back{margin-top:32px}.coverflow{height:410px;margin-inline:-20px}.slide{width:clamp(190px,64vw,285px);border-radius:16px}.upload{align-items:flex-start;flex-direction:column}.intro{padding-top:34px}}</style></head><body><main class="gallery-page"><header class="topbar"><a class="brand" href="EgZjaHJvbWUqBwgDEA.html">orange <span>♥</span></a><div class="topbar-actions"><button class="theme-toggle" id="theme-toggle" type="button"><span aria-hidden="true">☾</span> Theme</button><button id="logout-btn" type="button"><span aria-hidden="true">↪</span> Log out</button></div></header><a class="back" href="EgZjaHJvbWUqBwgDEA.html">← Back home</a><section class="intro"><p class="eyebrow">private gallery</p><h1>Our <em>moments</em>, in motion.</h1><p>A little carousel of the frames we never want to lose.</p></section><section class="coverflow" id="gallery"><div class="empty">Loading our little memories…</div></section><div class="controls"><button id="previous" type="button" aria-label="Previous photo">←</button><span class="counter" id="counter">—</span><button id="next" type="button" aria-label="Next photo">→</button></div><section class="upload"><div><p class="eyebrow">Add a memory</p><p>Private, shared, and always here.</p></div><label>Choose photos<input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple></label></section><p class="status" id="status" role="status"></p></main><script src="theme.js"></script><script type="module" src="gallery.js"></script></body></html>
