<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Gallery</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style2.css"><style>.gallery-page{width:min(1220px,100%);margin:auto;padding:28px clamp(20px,5vw,64px) 64px}.back{display:inline-block;margin-top:48px;color:var(--accent);text-decoration:none;font-weight:700}.intro{padding:48px 0 34px}.intro h1{max-width:800px;margin:9px 0 13px;font:600 clamp(3rem,8vw,6.4rem)/.88 "Playfair Display",serif;letter-spacing:-.07em}.intro h1 em{color:var(--accent)}.intro>p:last-child{max-width:460px;margin:0;color:var(--muted);line-height:1.65}.upload{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:21px 24px;margin-bottom:28px;border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}.upload-copy{display:flex;align-items:center;gap:13px}.upload-mark{display:grid;place-items:center;width:39px;height:39px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:1.25rem}.upload p{margin:0;color:var(--muted);font-size:.86rem}.upload label{padding:11px 17px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.upload input{display:none}.status{min-height:22px;margin:0 2px 18px;color:var(--muted);font-size:.86rem}.wall{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.photo{grid-column:span 6;min-height:370px;margin:0;overflow:hidden;border-radius:25px;background:var(--surface);box-shadow:var(--shadow);cursor:zoom-in}.photo.hero{grid-column:span 12;min-height:min(68vh,710px)}.photo:nth-child(4n){grid-column:span 7}.photo:nth-child(4n+1):not(.hero){grid-column:span 5}.photo img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .45s ease}.photo:hover img{transform:scale(1.035)}.empty{grid-column:1/-1;padding:70px 25px;text-align:center;border:1px dashed var(--line);border-radius:24px;color:var(--muted)}dialog{width:min(1000px,94vw);max-height:92vh;padding:0;border:0;border-radius:22px;background:transparent;overflow:hidden}dialog::backdrop{background:rgba(20,13,17,.82);backdrop-filter:blur(6px)}dialog img{display:block;max-width:100%;max-height:88vh;margin:auto;border-radius:18px}.close{position:fixed;top:22px;right:22px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#402f35;font-size:1.4rem;cursor:pointer}@media(max-width:700px){.gallery-page{padding-bottom:40px}.intro{padding-top:38px}.wall{gap:11px}.photo,.photo:nth-child(4n),.photo:nth-child(4n+1):not(.hero){grid-column:span 12;min-height:330px;border-radius:19px}.photo.hero{min-height:440px}.upload{align-items:flex-start;flex-direction:column}.back{margin-top:34px}}</style></head><body><main class="gallery-page"><header class="topbar"><a class="brand" href="EgZjaHJvbWUqBwgDEA.html">orange <span>♥</span></a><div class="topbar-actions"><button class="theme-toggle" id="theme-toggle" type="button"><span aria-hidden="true">☾</span> Theme</button><button id="logout-btn" type="button"><span aria-hidden="true">↪</span> Log out</button></div></header><a class="back" href="EgZjaHJvbWUqBwgDEA.html">← Back home</a><section class="intro"><p class="eyebrow">private gallery</p><h1>All our <em>little</em> moments.</h1><p>Every frame we want to keep close, kept safely in our shared space.</p></section><section class="upload"><div class="upload-copy"><div class="upload-mark">✦</div><div><p class="eyebrow">Add a memory</p><p>Private, shared, and always here.</p></div></div><label>Choose photos<input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple></label></section><p class="status" id="status" role="status"></p><section class="wall" id="gallery"><div class="empty">Loading our little memories…</div></section></main><dialog id="lightbox"><button class="close" type="button" aria-label="Close photo">×</button><img alt="A private shared memory"></dialog><script src="theme.js"></script><script type="module" src="gallery.js"></script></body></html>
