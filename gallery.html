<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Gallery</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style2.css"><style>.gallery-page{width:min(1120px,100%);margin:auto;padding:28px clamp(20px,5vw,64px) 48px}.back{display:inline-block;margin-top:42px;color:var(--accent);text-decoration:none;font-weight:700}.intro{padding:42px 0 28px}.intro h1{margin:8px 0;font:600 clamp(2.7rem,7vw,5rem)/.95 "Playfair Display",serif;letter-spacing:-.06em}.intro p{max-width:500px;margin:0;color:var(--muted);line-height:1.6}.upload{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}.upload label{padding:10px 15px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}.upload input{display:none}.upload p{margin:0;color:var(--muted);font-size:.86rem}.status{min-height:22px;margin:14px 2px;color:var(--muted);font-size:.86rem}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.photo{aspect-ratio:1/1;border-radius:19px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}.photo img{width:100%;height:100%;object-fit:cover}.empty{grid-column:1/-1;padding:45px;text-align:center;border:1px dashed var(--line);border-radius:19px;color:var(--muted)}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.upload{align-items:flex-start;flex-direction:column}.back{margin-top:32px}}</style></head><body><main class="gallery-page"><header class="topbar"><a class="brand" href="EgZjaHJvbWUqBwgDEA.html">orange <span>♥</span></a><div class="topbar-actions"><button class="theme-toggle" id="theme-toggle" type="button"><span aria-hidden="true">☾</span> Theme</button><button id="logout-btn" type="button"><span aria-hidden="true">↪</span> Log out</button></div></header><a class="back" href="EgZjaHJvbWUqBwgDEA.html">← Back home</a><section class="intro"><p class="eyebrow">private gallery</p><h1>Us, in frames.</h1><p>Only people who enter our secret code can see the memories here.</p></section><section class="upload"><div><p class="eyebrow">Add a memory</p><p>Photos are kept private in our shared space.</p></div><label>Choose photos<input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple></label></section><p class="status" id="status" role="status"></p><section class="grid" id="gallery"><div class="empty">Loading our little memories…</div></section></main><script src="theme.js"></script><script type="module" src="gallery.js"></script><script>document.getElementById('logout-btn').addEventListener('click',()=>{localStorage.removeItem('accessGranted');location.href='index.html'})</script></body></html>
