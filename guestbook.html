<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Little Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style2.css">
  <style>
    .page{width:min(760px,100%);margin:auto;padding:28px 20px 48px}.back{display:inline-block;margin-top:42px;color:var(--accent);text-decoration:none;font-weight:700}.heading{margin:44px 0 30px}.heading h1{margin:9px 0;font:600 clamp(2.5rem,8vw,4.5rem)/.95 "Playfair Display",serif;letter-spacing:-.05em}.heading p{margin:0;color:var(--muted)}.composer,.message-card{border:1px solid var(--line);background:var(--surface-strong);box-shadow:var(--shadow)}.composer{padding:16px;border-radius:20px}.identity{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:.88rem;color:var(--muted)}.identity select{width:150px;border:0;border-bottom:1px solid var(--line);outline:0;padding:5px;background:transparent;color:var(--text);font:inherit}textarea{display:block;width:100%;min-height:112px;padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);font:inherit;resize:vertical}textarea:focus,.identity select:focus{outline:2px solid var(--accent-soft);outline-offset:2px}.send{margin-top:12px;padding:10px 16px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:600 .94rem "DM Sans",sans-serif;cursor:pointer}.send:disabled{opacity:.6;cursor:wait}.status{min-height:20px;margin:9px 2px 0;color:var(--muted);font-size:.82rem}.messages{display:grid;gap:12px;margin-top:26px}.message-card{padding:17px;border-radius:16px}.message-meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;color:var(--muted);font-size:.8rem}.message-meta strong{color:var(--accent)}.message-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}@media(max-width:480px){.back{margin-top:32px}.identity{align-items:flex-start;flex-direction:column;gap:3px}.identity select{width:100%}}
  </style>
<style>
  .identity select { color-scheme: light; }
  html[data-theme="dark"] .identity select { background:var(--surface-strong); color:var(--text); color-scheme:dark; }
  html[data-theme="dark"] .identity select option { background:#342a31; color:#f9ecee; }
</style>
</head>
<body><main class="page"><header class="topbar"><a class="brand" href="EgZjaHJvbWUqBwgDEA.html" aria-label="Home">orange <span>♥</span></a><div class="topbar-actions"><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode"><span aria-hidden="true">☾</span> Theme</button><button id="logout-btn" type="button"><span aria-hidden="true">↪</span> Log out</button></div></header><a class="back" href="EgZjaHJvbWUqBwgDEA.html">← Back home</a><header class="heading"><p class="eyebrow">love notes</p><h1>Our little chat.</h1><p>A place for the things we want each other to find.</p></header><form class="composer" id="note-form"><label class="identity" id="identity-picker">Writing as <select id="nickname" aria-label="Your name"><option value="">Choose once…</option><option value="Jechoo">Jechoo</option><option value="Piya">Piya</option></select></label><label><span class="eyebrow">Your note</span><br><br><textarea id="message" maxlength="500" required placeholder="Leave a little thought…"></textarea></label><button class="send" id="send" type="submit">Send note</button><p class="status" id="status" role="status"></p></form><section class="messages" id="messages-list" aria-live="polite"><div class="empty">Loading your notes…</div></section></main>
<script src="theme.js"></script><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, serverTimestamp, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const config={apiKey:"AIzaSyD_l5r2S8Z_9CC64cviB72MYhh2BX1Q97Y",authDomain:"burgerpops-121224.firebaseapp.com",projectId:"burgerpops-121224",storageBucket:"burgerpops-121224.appspot.com",messagingSenderId:"1204666668",appId:"1:1204666668:web:37ac2f645f411702aa6c89"};
const app=initializeApp(config),db=getFirestore(app),auth=getAuth(app),form=document.querySelector('#note-form'),name=document.querySelector('#nickname'),message=document.querySelector('#message'),list=document.querySelector('#messages-list'),status=document.querySelector('#status'),send=document.querySelector('#send');
const savedName=localStorage.getItem('nickname');if(savedName==='Jechoo'||savedName==='Piya'){name.value=savedName;name.disabled=true;document.querySelector('#identity-picker').textContent=`Writing as ${savedName}`;}name.addEventListener('change',()=>{if(name.value){localStorage.setItem('nickname',name.value);name.disabled=true;document.querySelector('#identity-picker').textContent=`Writing as ${name.value}`}});
const addText=(parent,tag,value,className)=>{const el=document.createElement(tag);if(className)el.className=className;el.textContent=value;parent.append(el);return el};
function render(notes){list.replaceChildren();if(!notes.length){list.innerHTML='<div class="empty">No notes yet. Leave the first little hello.</div>';return}notes.forEach(entry=>{const data=entry.data(),card=document.createElement('article'),meta=document.createElement('div'),remove=document.createElement('button');card.className='message-card';meta.className='message-meta';addText(meta,'strong',data.nickname||'Anonymous');remove.className='delete-message';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Delete this chat message');remove.addEventListener('click',async()=>{if(!confirm('Delete this chat message?'))return;remove.disabled=true;try{await deleteDoc(doc(db,'loveNotes',entry.id))}catch{status.textContent='That message could not be deleted. Please try again.';remove.disabled=false}});meta.append(remove);card.append(meta);addText(card,'p',data.text||'','message-text');addText(card,'small',data.timestamp?.toDate?data.timestamp.toDate().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'Sending…','message-date');list.append(card)})}
onSnapshot(query(collection(db,'loveNotes'),orderBy('timestamp','desc'),limit(50)),snap=>render(snap.docs),()=>{list.innerHTML='<div class="empty">Notes could not load right now.</div>'});
form.addEventListener('submit',async event=>{event.preventDefault();const text=message.value.trim(),nickname=localStorage.getItem('nickname');if(!text)return;if(nickname!=='Jechoo'&&nickname!=='Piya'){status.textContent='Choose Jechoo or Piya once before sending.';return}send.disabled=true;status.textContent='Sending…';try{await addDoc(collection(db,'loveNotes'),{text:text.slice(0,500),nickname,timestamp:serverTimestamp()});message.value='';status.textContent='Sent with love.'}catch{status.textContent='Could not send your note. Please try again.'}finally{send.disabled=false}});
</script><script>document.getElementById('logout-btn').addEventListener('click',()=>{localStorage.removeItem('accessGranted');location.href='index.html'})</script></body></html>
