<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For Us</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet"><style>:root{--bg:#fff7f7;--surface:#fff;--text:#402f35;--muted:#876e76;--line:#eadde0;--accent:#be657b;--soft:#f8dce2;--shadow:0 18px 48px #6538441a}html[data-theme=dark]{--bg:#211b20;--surface:#342a31;--text:#f9ecee;--muted:#c7abb3;--line:#ffffff22;--accent:#ef9aad;--soft:#633e4a}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(circle at 12% 0,#ffe7ec,transparent 26rem),var(--bg);color:var(--text);font-family:"DM Sans",sans-serif}.shell{width:min(1120px,100%);min-height:100vh;margin:auto;padding:28px clamp(20px,5vw,64px);display:flex;flex-direction:column}.top{display:flex;justify-content:space-between}.brand{font:600 1.25rem "Playfair Display",serif;letter-spacing:.08em}.brand span,.eyebrow{color:var(--accent)}button{font:inherit}.theme-toggle{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);cursor:pointer}.card{width:min(450px,100%);margin:auto;padding:clamp(28px,6vw,52px);border:1px solid var(--line);border-radius:28px;background:var(--surface);box-shadow:var(--shadow)}.lock{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:var(--soft);color:var(--accent);font-size:1.25rem}.eyebrow{margin:25px 0 0;font-size:.72rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.card h1{margin:10px 0 12px;font:600 clamp(2.4rem,7vw,4rem)/.95 "Playfair Display",serif;letter-spacing:-.05em}.card p{color:var(--muted);line-height:1.6}.field{display:block;margin-top:28px;color:var(--muted);font-size:.88rem}.field input{width:100%;margin-top:8px;padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text);font:inherit}.submit{width:100%;margin-top:13px;padding:12px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}.error{min-height:20px;margin:10px 0 0;color:var(--accent);font-size:.85rem}</style></head><body><main class="shell"><header class="top"><div class="brand">orange <span>♥</span></div><button class="theme-toggle" id="theme-toggle" type="button"><span aria-hidden="true">☾</span> Theme</button></header><section class="card"><div class="lock">♡</div><p class="eyebrow">a private little corner</p><h1>Welcome back.</h1><p>Enter our secret word to step inside.</p><form id="login-form"><label class="field">Secret word<input type="password" id="secretInput" required autofocus></label><button class="submit" type="submit">Come in</button><p class="error" id="errorMessage" role="status"></p></form></section></main><script src="theme.js"></script></body></html>
