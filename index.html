<main class="dashboard">

    <section class="hero">
        <p id="dynamicHeader"></p>
    </section>

    <section class="widget-grid">

        <div class="widget" id="daysWidget">
            <i data-lucide="heart"></i>

            <span class="widget-title">
                Days Together
            </span>

            <span id="daysCount" class="widget-value">
                ...
            </span>
        </div>

        <div class="widget">
            <i data-lucide="map-pinned"></i>

            <span class="widget-title">
                Distance
            </span>

            <span class="widget-value">
                143 km
            </span>
        </div>

        <div class="widget" onclick="window.location='gallery.html'">

            <i data-lucide="images"></i>

            <span class="widget-title">
                Gallery
            </span>

            <span class="widget-value">
                Open
            </span>

        </div>

        <div class="widget" onclick="window.location='guestbook.html'">

            <i data-lucide="notebook-text"></i>

            <span class="widget-title">
                Notes
            </span>

            <span class="widget-value">
                Open
            </span>

        </div>

    </section>

</main>

<nav class="bottom-nav">

    <button class="active">
        <i data-lucide="house"></i>
    </button>

    <button onclick="window.location='gallery.html'">
        <i data-lucide="images"></i>
    </button>

    <button onclick="window.location='guestbook.html'">
        <i data-lucide="notebook-text"></i>
    </button>

</nav>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
lucide.createIcons();
</script>
