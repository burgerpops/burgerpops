<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sticky Notes</title><link rel="stylesheet" href="style2.css"><style>.page{width:min(920px,100%);margin:auto;padding:28px clamp(20px,5vw,64px) 54px}.back{display:inline-block;margin-top:42px;color:var(--accent);text-decoration:none;font-weight:700}.heading{margin:52px 0 28px}.heading h1{margin:9px 0;font:600 clamp(2.7rem,8vw,4.8rem)/.95 "Playfair Display",serif;letter-spacing:-.06em}.heading em{color:var(--accent)}.heading p{margin:0;color:var(--muted)}.composer{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}.composer input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;outline:0;padding:8px}.send{border:0;border-radius:999px;padding:10px 15px;background:var(--accent);color:#fff;font:700 .9rem "DM Sans",sans-serif;cursor:pointer}.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.note{min-height:142px;padding:18px;border-radius:4px 18px 18px 18px;background:linear-gradient(135deg,#fff9c9,#ffe8ae);box-shadow:0 12px 24px rgba(107,77,31,.12);color:#5c4932;transform:rotate(var(--tilt))}.note:nth-child(3n+2){background:linear-gradient(135deg,#ffdfe7,#ffcbd9)}.note:nth-child(3n){background:linear-gradient(135deg,#dff4ee,#c7ece2)}.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.note small{display:block;margin-top:18px;color:rgba(72,52,45,.62)}.status{min-height:20px;margin:10px 2px;color:var(--muted);font-size:.85rem}.empty{grid-column:1/-1;padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}@media(max-width:650px){.notes{grid-template-columns:repeat(2,1fr)}.back{margin-top:30px}.heading{margin-top:40px}}@media(max-width:400px){.notes{grid-template-columns:1fr}.composer{align-items:stretch;flex-direction:column}}</style></head><body><main class="page"><header class="topbar"><a class="brand" href="EgZjaHJvbWUqBwgDEA.html">orange <span>♥</span></a><div class="topbar-actions"><button class="theme-toggle" id="theme-toggle" type="button"><span aria-hidden="true">☾</span> Theme</button><button id="logout-btn" type="button"><span aria-hidden="true">↪</span> Log out</button></div></header><a class="back" href="EgZjaHJvbWUqBwgDEA.html">← Back home</a><section class="heading"><p class="eyebrow">sticky notes</p><h1>Small things to <em>find</em>.</h1><p>For reminders, little jokes, and sudden thoughts of each other.</p></section><form class="composer" id="note-form"><input id="note-text" maxlength="240" required placeholder="Leave a little note…" aria-label="New sticky note"><button class="send" type="submit">Pin it</button></form><p class="status" id="status" role="status"></p><section class="notes" id="notes" aria-live="polite"><div class="empty">Loading your little notes…</div></section></main><script src="theme.js"></script><script type="module" src="sticky-notes.js"></script></body></html>
